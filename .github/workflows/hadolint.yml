name: hadolint

on:
  push:
    branches:
      - fb_*
      - '*_fb_*'

  pull_request:
    branches:
      - develop
      - 'release*'

jobs:
  hadolint:
    name: hadolint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          ignore: 'DL3064,DL3025,DL3066'
