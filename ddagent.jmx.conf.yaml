---
instances:
- host: localhost
  port: 7199
  name: tomcat_lk_labkey_operations
  conf:
  - include:
      bean: LabKey:name=Operations
      attribute:
      - ActiveUserSessionCount
      - MinutesSinceMostRecentUserActivity
- host: localhost
  port: 7199
  name: tomcat_lk_labkey_pipeline
  conf:
  - include:
      bean: LabKey:name=Pipeline
      attribute:
      - PipelineQueueSize
- host: localhost
  port: 7199
  name: tomcat_lk_labkey_search
  conf:
  - include:
      bean: LabKey:name=Search
      attribute:
      - Busy
      - NumDocs
      - Running
- host: localhost
  port: 7199
  name: tomcat_lk_catalina_datasource
  conf:
  - include:
      bean: Catalina:type=DataSource,host=localhost,context=/,class=javax.sql.DataSource,name="jdbc/labkeyDataSource"
      attribute:
      - maxWaitMillis
      - numActive
      - numIdle
- host: localhost
  port: 7199
  name: tomcat_lk_catalina_manager
  conf:
  - include:
      bean: Catalina:type=Manager,host=localhost,context=/
      attribute:
      - activeSessions
logs: []


init_config:
# Nothing to configure here
